name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Check code quality
        run: ruff check src tests main.py && ruff format --check src tests main.py
      - name: Run hermetic test suite
        run: python -m pytest

  distributions:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build platformdirs
          python -m src.scripts.build_default_vocab --check
          python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/finnish-drill-smoke
          /tmp/finnish-drill-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed command and packaged data outside checkout
        working-directory: /tmp
        run: |
          /tmp/finnish-drill-smoke/bin/finnish-drill --help
          /tmp/finnish-drill-smoke/bin/finnish-drill --version
          /tmp/finnish-drill-smoke/bin/python - <<'PY'
          from importlib.resources import files
          from src.data.vocab import load_book_of_mormon_vocab

          assert files("src.data").joinpath("default_vocab.json").is_file()
          assert files("src.data").joinpath("default_vocab.csv").is_file()
          nouns, verbs = load_book_of_mormon_vocab()
          assert nouns and verbs
          PY
