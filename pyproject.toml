[project]
name = "finnish-inflection-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inquirerpy>=0.3.4",
    "rich>=14.3.3",
    "uralicnlp>=2.1.0",
    "platformdirs>=4.3.6",
    "prompt-toolkit>=3.0.48",
]

[project.scripts]
finnish-drill = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
artifacts = ["book_of_mormon_complete.csv"]

[tool.hatch.build.targets.sdist]
include = ["src", "book_of_mormon_complete.csv", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
