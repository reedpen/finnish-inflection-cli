[project]
name = "finnish-inflection-cli"
version = "0.1.0"
description = "Interactive Finnish noun, adjective, and verb inflection practice"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "inquirerpy>=0.3.4",
    "rich>=14.3.3",
    "uralicnlp>=2.1.0",
    "platformdirs>=4.3.6",
    "prompt-toolkit>=3.0.48",
]

[project.scripts]
finnish-drill = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "LICENSE", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: requires the real Finnish UralicNLP model",
]
